# Sends daily nudges and the Monday wrap-up via Firebase Cloud Messaging.
# Uses the same service account secret that deploys the site.
name: Reminders
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
concurrency: reminders
jobs:
  nudge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save google-auth-library@9
      - run: node nudge.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HOUSEHOLD_CHORES_73E50 }}
